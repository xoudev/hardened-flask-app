version: 2

updates:
  # Dépendances Python (requirements.txt et requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Attendre 7 jours avant de proposer une version tout juste publiée (supply chain).
    # Ne s'applique pas aux mises à jour de sécurité, qui restent immédiates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Image de base du Dockerfile (builder et runtime, épinglés par digest)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Attendre 7 jours avant de proposer une version tout juste publiée (supply chain).
    # Ne s'applique pas aux mises à jour de sécurité, qui restent immédiates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  # Images PostgreSQL et Vault de docker-compose.yml (épinglées par digest)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # Attendre 7 jours avant de proposer une version tout juste publiée (supply chain).
    # Ne s'applique pas aux mises à jour de sécurité, qui restent immédiates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  # Actions GitHub (épinglées par SHA de commit)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Attendre 7 jours avant de proposer une version tout juste publiée (supply chain).
    # Ne s'applique pas aux mises à jour de sécurité, qui restent immédiates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
