name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gate:
    name: Build & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Cloner l'historique complet pour que Gitleaks puisse auditer les commits
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Détection de secrets dans les fichiers et commits
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Compilation de l'image Distroless
      - name: Build Docker image
        run: |
          docker build -t lab-python-app:${{ github.sha }} .

      # 4. Audit de sécurité du conteneur avec Trivy
      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'