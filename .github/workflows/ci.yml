name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-security-and-tests:
    name: Code Quality, Unit Tests & SAST
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v4.2.2 (épinglé par commit SHA)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # gitleaks-action v2.3.8 (épinglé par commit SHA)
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e5f586a111a4cf1da24a87c12658e370cf9f7ef0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # actions/setup-python v5.3.0 (épinglé par commit SHA)
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v test_app.py

      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config auto --error

  container-security:
    name: Container Build & SCA Audit
    runs-on: ubuntu-latest
    needs: code-security-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: |
          docker build -t lab-python-app:${{ github.sha }} .

      # trivy-action v0.30.0 (épinglé par commit SHA)
      - name: Scan Python dependencies (Strict Gate)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Audit OS base image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'