name: Test Pipeline

# 1. Déclencheurs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Travaux à exécuter
jobs:
  smoke-test:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      # Étape A : Cloner le dépôt Git sur la VM éphémère
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # Étape B : Exécuter une simple commande shell
      - name: Vérifier l'environnement du runner
        run: |
          echo "Utilisateur actuel : $(whoami)"
          docker --version
          python3 --version

      # Étape C : Tester la compilation de l'image Distroless
      - name: Compiler l'image Docker
        run: |
          docker build -t lab-python-app:test .