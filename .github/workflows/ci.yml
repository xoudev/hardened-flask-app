name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # JOB 1 : SAST/TEST/QUALITY
  code-security-and-unit-test: 
    name: Code Quality, Unit Tests & SAST
    runs-on: ubuntu-latest
    
    steps:
      - name : Checkout repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      # Détection des secrets pré-commit
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-actions@v2
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #2. Environnement python pour les tests
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      #3. Linter Qualité syntaxique
      - name: Lint with Ruff
        run: |
          ruff check .
      
      #4 Test unitaire
      - name: Run unit test with Pytest
        run: |
          pytest -v test_app.py
      
      #5 Scan SAST avec semgrep (owasp top 10)
      - name: Run semgrep SAST
        run: | 
          pip install semgrep
          semgrep scan --config auto --error
  # JOB2: Build
  container-security: 
    name: Container Build & SCA audit
    runs-on: ubuntu-latest
    needs: code-security-and-unit-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #1 Compilation de l'image
      - name: Build docker image
        run: |
          docker build -t lab-python-app:${{ github.sha }}
      
# 2. Scan des dépendances Python (Porte bloquante sur HIGH/CRITICAL)
      - name: Scan Python dependencies (Strict Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # 3. Audit de l'OS sous-jacent (Traçabilité)
      - name: Audit OS base image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'