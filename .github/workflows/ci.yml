name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Un nouveau commit sur une PR annule le run précédent de cette PR (jamais sur main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-security-and-tests:
    name: Code Quality, Unit Tests & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2 (épinglé par commit SHA)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # gitleaks-action v2.3.8 (épinglé par commit SHA)
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # Mauvaises pratiques dans le Dockerfile (Trivy ne lit pas docker-compose.yml)
      - name: Scan Dockerfile misconfigurations (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan dependencies in requirements.txt (Trivy FS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # actions/setup-python v5.3.0 (épinglé par commit SHA)
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config auto --error

  container-security:
    name: Container Build & SCA Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code-security-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build -t lab-python-app:${{ github.sha }} .

      # trivy-action v0.30.0 (épinglé par commit SHA)
      - name: Scan Python dependencies (Strict Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Audit OS base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'lab-python-app:${{ github.sha }}'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

  # Images tierces (PostgreSQL, Vault) : la liste vient de docker-compose.yml, jamais recopiée ici
  list-compose-images:
    name: List compose images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: code-security-and-tests
    outputs:
      images: ${{ steps.list.outputs.images }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # lab-python-app est construite par la CI et déjà auditée par container-security
      - name: List third-party images
        id: list
        run: |
          images=$(docker compose config --images | grep -v '^lab-python-app$' | jq -R . | jq -sc .)
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  scan-third-party-images:
    name: Third-party image audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: list-compose-images
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.list-compose-images.outputs.images) }}

    steps:
      # Rapport seulement : les CVE de gosu (PostgreSQL) et go-jose (Vault) viennent de l'amont
      - name: Audit ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: container-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Application starts
        run: ./scripts/reset_lab.sh

      - name: Get Docker Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  dast-scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: container-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build local image for DAST
        run: |
          docker build -t lab-python-app:dast .

      - name: Run containerized application
        run: |
          docker run -d --name flask-dast-target -p 5000:5000 -e FLASK_RUN_HOST=0.0.0.0 lab-python-app:dast
          
          # Attente active avec affichage du statut
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5000/health > /dev/null; then
              echo "Application prête après ${i}s."
              exit 0
            fi
            echo "En attente du conteneur (${i}/15)..."
            sleep 1
          done

          echo "ERREUR : L'application n'a pas répondu à temps. Inspectons l'état du conteneur :"
          docker ps -a --filter "name=flask-dast-target"
          docker logs flask-dast-target
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: 'http://127.0.0.1:5000/health'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-m 1 -a'
          allow_issue_writing: false
          fail_action: true