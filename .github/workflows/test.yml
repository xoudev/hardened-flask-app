name: Test OIDC Request & Decode

on:
  workflow_dispatch: # Permet le déclenchement manuel depuis l'onglet Actions

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    
    # Déclaration explicite des permissions requises pour l'OIDC
    permissions:
      id-token: write # Nécessaire pour générer les variables ACTIONS_ID_TOKEN_REQUEST_*
      contents: read  # Bonne pratique par défaut

    steps:
      - name: Request and Decode GitHub OIDC Token
        run: |
          # 1. Demande du jeton JWT à l'API interne de GitHub avec l'audience demandée
          RESPONSE=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")
          
          # 2. Extraction de la valeur brute du token JWT
          JWT=$(echo "$RESPONSE" | jq -r '.value')
          
          # Sécurité : Vérifie si le token a bien été récupéré
          if [ -z "$JWT" ] || [ "$JWT" == "null" ]; then
            echo "Erreur : Impossible de récupérer le jeton. Réponse de l'API :"
            echo "$RESPONSE"
            exit 1
          fi
          
          # 3. Découpage du JWT (3 parties séparées par des points : en-tête.charge.signature)
          # On extrait la deuxième partie (la charge / payload) indexée à 1
          PAYLOAD_BASE64=$(echo "$JWT" | cut -d'.' -f2)
          
          # 4. Décodage Base64 standard avec ajustement du padding '=' si nécessaire, puis formatage jq
          echo "=== CHARGE DU JETON OIDC (PAYLOAD) ==="
          echo "$PAYLOAD_BASE64" | base64 --decode 2>/dev/null | jq .
